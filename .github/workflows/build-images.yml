# Builds the app images that Home Assistant downloads, one per architecture, and pushes them to
# ghcr.io/<owner>/homeace-studio-<arch>:<version>. Runs when the version in config.yaml changes on
# main, or by hand (Actions → Build app images → Run workflow).
# Order: checks (lint, tests, build) → both images → tag v<version> and a GitHub release with the
# changelog section. Nothing is built when a check fails; no release when an image fails.
name: Build app images

on:
  push:
    branches: [main]
    paths: ["homeace-studio/config.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: Image ${{ matrix.arch }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from config.yaml
        id: version
        run: |
          version="$(sed -n 's/^version: *"\(.*\)"/\1/p' homeace-studio/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same folder the HA Supervisor would build from: Dockerfile plus sources.
      - name: Assemble the build folder
        run: node scripts/build-addon.mjs

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: dist-addon/homeace_studio
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/homeace-studio-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/homeace-studio-${{ matrix.arch }}:latest
          labels: |
            io.hass.name=HomeAce Studio
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=A clearer UI for Home Assistant automations, scripts, scenes and helpers
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    name: Tag and GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The section "## <version>" of the changelog becomes the release notes. A second run for the
      # same version (Run workflow by hand) leaves an existing release alone.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version: *"\(.*\)"/\1/p' homeace-studio/config.yaml)"
          test -n "$version"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version exists already."
            exit 0
          fi
          awk -v head="## $version" '
            $0 == head { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' homeace-studio/CHANGELOG.md > notes.md
          test -s notes.md || { echo "No changelog section for $version"; exit 1; }
          gh release create "v$version" --target "$GITHUB_SHA" --title "HomeAce Studio $version" \
            --notes-file notes.md

# Weekly pull requests for outdated or vulnerable dependencies. Minor and patch updates come grouped in
# one pull request per part, so the list stays short; the Checks workflow tests every pull request.
# Security updates come right away, independent of this schedule (also for major versions).
# Major versions (NestJS 12, TypeScript 7, …) are no automatic pull requests: they often need code
# changes and packages that belong together (all @nestjs/*), so they are a planned task of their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The Node base image of the app; major versions only together with a deliberate Node upgrade.
  - package-ecosystem: docker
    directory: /homeace-studio
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

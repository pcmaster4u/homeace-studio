# Home Assistant add-on definition. Docs: https://developers.home-assistant.io/docs/add-ons/configuration
name: HomeAce Studio
version: "0.7.2"
slug: homeace_studio
description: A clearer UI for automations, scripts, scenes and helpers, with nested categories.
url: https://github.com/shadowtsw/homeace-studio
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto

# Opens inside HA (sidebar entry); no own port, login or token needed.
ingress: true
ingress_port: 8099
panel_icon: mdi:file-tree-outline
panel_title: HomeAce Studio

# Gives the add-on SUPERVISOR_TOKEN and the Core API through the Supervisor proxy.
homeassistant_api: true

# /config inside the container = the add-on's own config folder (part of HA backups).
# The overlay file (own extras like owned categories) lives there.
map:
  - addon_config:rw
